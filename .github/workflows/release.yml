name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default; the release job elevates to contents: write to create
# the GitHub Release and upload assets (OpenSSF Token-Permissions).
permissions:
  contents: read

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release + upload assets
      id-token: write      # keyless cosign signing + SLSA provenance (OIDC)
      attestations: write  # SLSA build-provenance attestations
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv venv && uv pip install -e ".[dev]" build cyclonedx-bom

      - name: Run tests
        run: uv run pytest --cov=lemma -v

      - name: Build package
        run: uv run python -m build

      - name: Generate SBOM
        run: uv run cyclonedx-py environment -o sbom.json --output-format json

      - name: Generate AI System Card
        run: |
          uv run lemma ai system-card --format json > ai-system-card.json
          uv run lemma ai system-card > ai-system-card.md

      - name: Generate AI BOM (CycloneDX 1.6)
        run: uv run lemma ai bom > aibom.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts (keyless cosign)
        run: |
          # Keyless: signing identity is this workflow's OIDC token (no private
          # key). Each artifact gets a Sigstore bundle verifiable with
          # `cosign verify-blob --bundle <f>.cosign.bundle ...`.
          for f in dist/* sbom.json aibom.cdx.json ai-system-card.json; do
            cosign sign-blob --yes --bundle "${f}.cosign.bundle" "$f"
          done

      - name: Attest SLSA build provenance (Python artifacts)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*

      - name: Capture AI System Card version
        id: card_version
        run: |
          version=$(uv run python -c 'import json;print(json.load(open("ai-system-card.json"))["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          generate_release_notes: true
          append_body: true
          body: |

            ---
            **AI System Card version:** `${{ steps.card_version.outputs.version }}`
            (frozen with this release; see `ai-system-card.md` and `ai-system-card.json` attached for the canonical AI configuration in force at tag time.)
          files: |
            dist/*
            sbom.json
            sbom.json.cosign.bundle
            aibom.cdx.json
            aibom.cdx.json.cosign.bundle
            ai-system-card.json
            ai-system-card.json.cosign.bundle
            ai-system-card.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
